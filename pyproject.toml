[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superlock"
version = "0.1"
description = "Secure file encryption and management tool"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
]

[project.scripts]
superlock = "superlock.main:main"
